dependencies:
  espressif/esp_lcd_touch: "~1.2.1"
  espressif/esp_lcd_touch_gt911:              # Waveshare ESP32-S3-Touch-LCD-4.3
    version: "~1.2.1"
    rules:
      - if: "target == esp32s3"
  espressif/esp_lcd_touch_ft5x06:             # WT32-SC01 Plus (FT6336)
    version: "~1.1.1"
    rules:
      - if: "target == esp32s3"
  espressif/esp_lcd_st7796:                   # WT32-SC01 Plus
    version: "~1.5.0"
    rules:
      - if: "target == esp32s3"
  espressif/esp_lcd_gc9a01:                   # ESP32-2424S012
    version: "~2.0.4"
    rules:
      - if: "target == esp32c3"
  espressif/esp_lcd_touch_cst816s:            # ESP32-2424S012 (CST816D)
    version: "~1.1.2"
    rules:
      - if: "target == esp32c3"
  idf:
    version: '>=5.3.0'
  lvgl/lvgl: "~9.6.0"
description: Panel boards. Waveshare support vendored from bobscott45/waveshare_esp32_s3_touch_lcd_4_3 1.0.7 with CH422G USB_SEL fix; WT32-SC01 Plus and ESP32-2424S012 added.
